<div class="advance-page">

  <div class="header">
    <h2>Employee Advance</h2>
    <p class="subtitle">Manage employee advance payments</p>
  </div>

  <div class="content">

    <!-- FORM -->
    <div class="card form-card">
      <h3>Add Advance</h3>

      <div class="form-grid">

        <div class="field">
          <label>Employee</label>
          <select [(ngModel)]="employee_id" (change)="onEmployeeChange()">
            <option value="">Select Employee</option>
            <option *ngFor="let e of employees" [value]="e.id">
              {{ e.name }}
            </option>
          </select>
        </div>

        <div class="field">
          <label>Date</label>
          <input type="date" [(ngModel)]="advance_date" />
        </div>

        <div class="field">
          <label>Amount</label>
          <input
            type="number"
            min="1"
            placeholder="₹ 0.00"
            [(ngModel)]="amount"
          />
        </div>

        <div class="field full">
          <label>Note</label>
          <input type="text" placeholder="Optional note" [(ngModel)]="note" />
        </div>

      </div>

      <button
        class="btn-primary"
        [disabled]="!canSave()"
        (click)="save()"
      >
        Save Advance
      </button>
    </div>

    <!-- HISTORY -->
    <div class="card history-card" *ngIf="history.length">
      <h3>Advance History</h3>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Added By</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let h of history">
              <td>{{ h.advance_date | date:'dd-MM-yyyy' }}</td>
              <td class="amount">₹ {{ h.amount }}</td>
              <td>{{ h.note || '-' }}</td>
              <td>{{ h.created_by }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
