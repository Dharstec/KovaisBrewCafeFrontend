<div class="auth-bg">

  <!-- Decorative blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Center Card -->
  <div class="auth-card" [class.otp-mode]="step === 'otp'">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <img src="assets/cafe_logo.webp" alt="" (error)="$any($event.target).style.display='none'" />
        <span class="brand-emoji">☕</span>
      </div>
      <div class="brand-text">
        <span class="brand-name">Kovai's Brew Café</span>
        <span class="brand-sub">Management Portal</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ══ LOGIN STEP ══ -->
    <ng-container *ngIf="step === 'login'">

      <div class="step-head">
        <h1>Welcome back</h1>
        <p>Sign in to your workspace to continue</p>
      </div>

      <div class="alert-error" *ngIf="error">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>

      <div class="field">
        <label class="field-label">Email address</label>
        <div class="input-row" [class.focused]="emailFocus">
          <svg class="fi" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" placeholder="you@company.com" [(ngModel)]="form.email"
            autocomplete="email"
            (focus)="emailFocus=true" (blur)="emailFocus=false"
            (keyup.enter)="submit()" />
        </div>
      </div>

      <div class="field">
        <label class="field-label">Password</label>
        <div class="input-row" [class.focused]="passFocus">
          <svg class="fi" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Enter your password"
            [(ngModel)]="form.password" autocomplete="current-password"
            (focus)="passFocus=true" (blur)="passFocus=false"
            (keyup.enter)="submit()" />
          <button type="button" class="eye-btn" (click)="showPassword=!showPassword" tabindex="-1">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button class="submit-btn" (click)="submit()" [disabled]="loading">
        <span class="btn-spinner" *ngIf="loading"></span>
        <ng-container *ngIf="!loading">
          Sign In
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </ng-container>
        <ng-container *ngIf="loading">Authenticating…</ng-container>
      </button>

    </ng-container>

    <!-- ══ OTP STEP ══ -->
    <ng-container *ngIf="step === 'otp'">

      <div class="step-head">
        <div class="otp-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16z"/></svg>
        </div>
        <h1>Check your email</h1>
        <p>We sent a 6-digit OTP to<br/><strong>{{ form.email }}</strong></p>
      </div>

      <div class="alert-error" *ngIf="error">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>

      <!-- OTP display boxes + hidden real input -->
      <div class="otp-wrap" (click)="focusOtp()">

        <div class="otp-boxes">
          <div
            *ngFor="let d of otpDigits; let i = index"
            class="otp-box"
            [class.active]="i === activeOtpIndex"
            [class.filled]="d !== ''">
            {{ d }}
          </div>
        </div>

        <!-- Single real input, visually hidden, captures all keystrokes -->
        <input
          #otpInput
          class="otp-real-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="6"
          autocomplete="one-time-code"
          [(ngModel)]="otpValue"
          (ngModelChange)="onOtpChange()"
        />

      </div>

      <p class="otp-note">Tap the boxes and type your code — auto-submits at 6 digits</p>

      <button class="submit-btn" (click)="submit()" [disabled]="loading || otpValue.length < 6">
        <span class="btn-spinner" *ngIf="loading"></span>
        <ng-container *ngIf="!loading">
          Verify &amp; Sign In
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </ng-container>
        <ng-container *ngIf="loading">Verifying…</ng-container>
      </button>

      <button class="ghost-btn" (click)="step='login'; error=''; otpValue=''" [disabled]="loading">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Use a different account
      </button>

    </ng-container>

  </div>

  <div class="auth-footer">
    Powered by <strong>Gokul</strong> &nbsp;·&nbsp; © 2025 Kovai's Brew Café
  </div>

</div>
