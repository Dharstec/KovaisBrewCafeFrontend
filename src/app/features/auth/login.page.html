<div class="login-wrapper">

  <div class="login-card">

    <!-- LEFT BRAND PANEL -->
    <div class="brand-panel">
      <img src="assets/cafe_logo.webp" class="logo" alt="Logo" />
      <h1>Kovai Brew Café</h1>
      <p>Secure Admin & User Login</p>
    </div>

    <!-- RIGHT FORM PANEL -->
    <div class="form-panel">

      <h2 *ngIf="step === 'login'">Welcome Back</h2>
      <h2 *ngIf="step === 'otp'">OTP Verification</h2>

      <p class="subtitle" *ngIf="step === 'login'">
        Sign in to continue
      </p>

      <p class="subtitle" *ngIf="step === 'otp'">
        Enter the OTP sent to your email
      </p>

      <div class="error" *ngIf="error">{{ error }}</div>

      <!-- EMAIL -->
      <div class="field">
        <label>Email</label>
        <input
          type="email"
          placeholder="kovaisbrewcafe@company.com"
          [(ngModel)]="form.email"
          [disabled]="step === 'otp'"
        />
      </div>

      <!-- PASSWORD -->
      <div class="field" *ngIf="step === 'login'">
        <label>Password</label>
        <input
          type="password"
          placeholder="Enter password"
          [(ngModel)]="form.password"
        />
      </div>

      <!-- OTP -->
      <div class="field" *ngIf="step === 'otp'">
        <label>OTP</label>
        <input
          type="text"
          placeholder="6-digit OTP"
          maxlength="6"
          [(ngModel)]="form.otp"
        />
      </div>

      <button (click)="submit()" [disabled]="loading">
        {{ loading ? 'Processing...' : (step === 'otp' ? 'Verify OTP' : 'Login') }}
      </button>

    </div>

  </div>

</div>
