<div class="att">

  <!-- Header -->
  <div class="att-header">
    <div class="att-header-left">
      <h1 class="att-title">Attendance</h1>
      <span class="att-subtitle">
        {{ isAdmin ? 'Manage attendance by date' : "Today's attendance" }}
      </span>
    </div>
    <div class="att-header-right" *ngIf="isAdmin">
      <div class="date-wrap">
        <svg class="date-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <input type="date" class="date-input" [(ngModel)]="date" (change)="load()" />
      </div>
    </div>
  </div>

  <!-- Section Title -->
  <div class="section-title">Employee List</div>

  <!-- Employee Grid -->
  <div class="emp-grid" *ngIf="list && list.length > 0; else emptyState">
    <div class="emp-card" *ngFor="let emp of list">

      <!-- Avatar -->
      <div class="emp-avatar">
        {{ emp.name.charAt(0).toUpperCase() }}
      </div>

      <!-- Info -->
      <div class="emp-info">
        <div class="emp-name">{{ emp.name }}</div>
        <div class="emp-role">Employee</div>
      </div>

      <!-- Status Toggle (Admin) -->
      <div class="status-toggle" *ngIf="isAdmin">
        <button
          class="toggle-btn toggle-p"
          [class.active-p]="emp.status === 'P'"
          (click)="emp.status = 'P'"
          type="button"
        >P</button>
        <button
          class="toggle-btn toggle-a"
          [class.active-a]="emp.status === 'A'"
          (click)="emp.status = 'A'"
          type="button"
        >A</button>
      </div>

      <!-- Read-only Status Badge -->
      <div class="status-badge-wrap" *ngIf="!isAdmin">
        <span class="badge-p" *ngIf="emp.status === 'P'">Present</span>
        <span class="badge-a" *ngIf="emp.status === 'A'">Absent</span>
      </div>

    </div>
  </div>

  <!-- Empty State -->
  <ng-template #emptyState>
    <div class="empty-state">
      <div class="empty-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <p class="empty-title">No employees found</p>
      <p class="empty-sub">Select a date to load attendance records.</p>
    </div>
  </ng-template>

  <!-- Save Bar -->
  <div class="save-bar" *ngIf="isAdmin && list && list.length > 0">
    <div class="save-bar-inner">
      <button class="save-btn" type="button" (click)="save()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Save Attendance
      </button>
    </div>
  </div>

</div>
