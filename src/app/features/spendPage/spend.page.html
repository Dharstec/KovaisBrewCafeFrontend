<div class="spend-layout">

  <!-- HEADER -->
  <div class="page-head">
    <div>
      <h1>Kovai Brew Café</h1>
      <p>Spend Management</p>
    </div>

    <div class="kpi-card" *ngIf="isAdmin">
      <span>This Month Spend</span>
      <h2>₹ {{ totalSpent }}</h2>
    </div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <input class="search" placeholder="Search by reason / amount" [(ngModel)]="params.searchTerm" (input)="search()" />

    <button class="btn-add" (click)="openAdd()">+ Add Spend</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th class="center">Date</th>
          <th class="center">Name</th>
          <th class="center">Payment Type</th>
          <th class="center">Amount</th>
          <th class="center">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of spendList">
          <td class="center">{{ s.spent_date }}</td>
          <td class="center">{{ s.reason }}</td>
          <td class="center">{{ s.payment_mode }}</td>
          <td class="center">₹ {{ s.amount }}</td>
          <td class="center">
            <button class="btn-link" (click)="openEdit(s)">Edit</button>
            <button class="btn-link danger" (click)="deleteSpend(s.id)">Delete</button>
          </td>
        </tr>

        <tr *ngIf="spendList.length === 0">
          <td colspan="4" class="empty">No records found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGINATION -->
  <div class="pagination" *ngIf="totalCount > params.pageSize">
    <button class="page-btn" [disabled]="params.page === 1" (click)="changePage(params.page - 1)">
      < Prev </button>

        <button class="page-btn" *ngFor="let p of totalPages" [class.active]="p === params.page"
          (click)="changePage(p)">
          {{ p }}
        </button>

        <button class="page-btn" [disabled]="params.page === totalPages.length" (click)="changePage(params.page + 1)">
          Next >
        </button>

        <select class="page-size" [(ngModel)]="params.pageSize" (change)="search()">
          <option [value]="5">5</option>
          <option [value]="10">10</option>
          <option [value]="20">20</option>
        </select>
  </div>

  <!-- OVERLAY -->
  <div class="overlay" *ngIf="showForm" (click)="closeForm()"></div>

  <!-- DRAWER -->
  <div class="drawer" *ngIf="showForm">
    <div class="drawer-header">
      <h3>{{ isEdit ? 'Edit Spend' : 'Add Spend' }}</h3>
      <button class="close-btn" (click)="closeForm()">✕</button>
    </div>

    <div class="drawer-body">
      <div class="field">
        <label>Name</label>
        <input placeholder="Eg: Milk purchase" [(ngModel)]="form.reason" />
      </div>

      <div class="field">
        <label>Amount</label>
        <input type="number" placeholder="₹ Amount" [(ngModel)]="form.amount" />
      </div>

      <div class="field">
        <label>Date</label>
        <input type="date" [(ngModel)]="form.date" [max]="maxDate" />
      </div>
      <div class="field">
        <label>Payment Mode</label>
        <select [(ngModel)]="form.payment_mode">
          <option value="CASH">Cash</option>
          <option value="UPI">UPI</option>
        </select>
      </div>

    </div>

    <div class="drawer-actions">
      <button class="btn-cancel" (click)="closeForm()">Cancel</button>
      <button class="btn-save" (click)="isEdit ? update() : save()">
        {{ isEdit ? 'Update Spend' : 'Save Spend' }}
      </button>
    </div>
  </div>


</div>
