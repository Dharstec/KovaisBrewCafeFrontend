<div class="add-stock">

  <div class="header">
    <h2>Add / Edit Stock</h2>
    <p class="subtitle">Daily refill, wastage or direct adjustment</p>
  </div>

  <div class="card">

    <div class="form-grid">

      <!-- PRODUCT -->
      <div class="field">
        <label>Product</label>
        <select [(ngModel)]="product_id" (change)="onProductChange()">
          <option value="">Select Product</option>
          <option *ngFor="let p of products" [value]="p.id">
            {{ p.name }}
          </option>
        </select>
      </div>

      <!-- QUANTITY -->
      <div class="field">
        <label>
          Quantity
          <span *ngIf="selectedProduct">
            ({{ selectedProduct.unit_label || selectedProduct.base_unit }})
          </span>
        </label>
        <input
          type="number"
          min="0"
          placeholder="Enter quantity"
          [(ngModel)]="inputQty"
        />
      </div>

      <!-- REASON -->
      <div class="field">
        <label>Action</label>
        <select [(ngModel)]="reason">
          <option value="DAILY_REFILL">Add Stock</option>
          <option value="WASTAGE">Reduce Stock</option>
          <option value="ADJUSTMENT">Set Exact Stock</option>
        </select>
      </div>

    </div>

    <button
      class="btn-primary"
      [disabled]="!canSave()"
      (click)="save()">
      Save Stock
    </button>

  </div>

</div>
